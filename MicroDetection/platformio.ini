; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Configurações comuns a todas as placas
[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    # Accept new functionality in a backwards compatible manner and patches
    etlcpp/Embedded Template Library @ ^20.46.2
    # Accept new functionality in a backwards compatible manner and patches
    adafruit/Adafruit BusIO @ ^1.17.4
    # Accept new functionality in a backwards compatible manner and patches 
    adafruit/SdFat - Adafruit Fork @ ^2.3.103

; ESP32 DevKit V1 (placa usada no MVP)
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1

; ESP32-S3 N16R8 (placa listada na lista de materiais do TCC)
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
